name: Run Tests

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            tox-env: py310
          - python-version: '3.11'
            tox-env: py311
          - python-version: '3.12'
            tox-env: py312
          - python-version: '3.13'
            tox-env: py313
          - python-version: '3.14'
            tox-env: py314
    
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Create virtual environment
      run: |
        uv venv --python "${{ matrix.python-version }}"
        
    - name: Install dependencies
      run: |
        uv pip install tox
        
    - name: Run tests with tox
      run: .venv/bin/python -m tox -e "${{ matrix.tox-env }}"

  # Stable gate named `test`: the branch ruleset requires a status check with
  # this exact name, so it must keep reporting now that the job is a matrix.
  test:
    name: test
    needs: matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require every Python version to pass
      run: |
        test "${{ needs.matrix.result }}" = "success"
